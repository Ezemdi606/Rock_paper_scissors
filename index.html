<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissors</title>
  </head>
  <body>
    <script>
      let user_score = 0;
      let computer_score = 0;
      let round = 0;
      const body = document.querySelector("body");
      const rock = document.createElement("button");
      const paper = document.createElement("button");
      const scissors = document.createElement("button");
      const msg = document.createElement("p");
      const results = document.createElement("p");

      function printResults() {
        body.appendChild(results);

        if (user_score == computer_score) {
          results.textContent = `Final score: You: ${user_score}, Computer: ${computer_score}, It's a tie. Tough battle!`;
        }
        else if (user_score > computer_score) {
          results.textContent = `Final score: You: ${user_score}, Computer: ${computer_score}. You win. Well played!`;
        }
        else
          results.textContent = `Final score: You: ${user_score}, Computer: ${computer_score}. You lose. Not good enough`;
        round = user_score = computer_score = 0;
      }
            
      function getComputer_choice() {
        let computerChoice = Math.floor(Math.random() * 3);
        if (computerChoice == 0)
          computerChoice = "rock";
        else if (computerChoice == 1)
          computerChoice = "paper";
        else if (computerChoice == 2)
          computerChoice = "scissors";
        return computerChoice;
      }

      rock.classList.add("rock");
      rock.textContent = "rock";
      body.appendChild(rock);
      rock.addEventListener("click", (e) => {Rock_paper_scissors_game(e.target.classList);});
      
      paper.classList.add("paper");
      paper.textContent = "paper";
      body.appendChild(paper);
      paper.addEventListener("click", (e) => {Rock_paper_scissors_game(e.target.classList);});
      
      scissors.classList.add("scissors");
      scissors.textContent = "scissors";
      body.appendChild(scissors);
      scissors.addEventListener("click", (e) => {Rock_paper_scissors_game(e.target.classList);});
      body.appendChild(msg);

      function Rock_paper_scissors_game(user_choice) {
        let computer_choice = getComputer_choice();
        results.textContent = "";
        if (user_choice == computer_choice) {
          msg.textContent = "It's a tie!";
          ++round;
        }
        else if ((user_choice == "rock") && (computer_choice == "scissors"))  {
          msg.textContent = "You win; Rock beats Scissors!";
          user_score = user_score + 1;
          ++round;
        }
        else if ((user_choice == "scissors") && (computer_choice == "rock"))  {
          msg.textContent = "You lose; Rock beats Scissors!";
          user_score = user_score + 1;
          ++round;
        }
        else if ((user_choice == "paper") && (computer_choice == "rock"))  {
          msg.textContent = "You win; Paper beats Rock!";
          user_score = user_score + 1;
          ++round;
        }
        else if ((user_choice == "rock") && (computer_choice == "paper")) {
          msg.textContent = "You lose; Paper beats Rock!";
          computer_score = computer_score + 1;
          ++round;
        }
        else if ((user_choice == "scissors") && (computer_choice == "paper")) {
          msg.textContent = "You win; Scissors beats Paper";
          user_score = user_score + 1;
          ++round;
        }
        else //((user_choice == "paper") && (computer_choice == "scissors")) 
        {
          msg.textContent = "You lose; Scissors beats Paper!";
          computer_score = computer_score + 1;
          ++round;
        }

        if (round == 6) printResults();
      }

    </script>
    </body
</html>
